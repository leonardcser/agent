name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  pr-title:
    name: Validate PR Title
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install coverage compiler tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run lints
        run: cargo clippy --workspace --all-targets --features smelt-tui/harness -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Check crate publication policy
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /tmp/cargo-metadata.json
          python3 <<'PY'
          import json

          with open("/tmp/cargo-metadata.json", encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          public = set(
              metadata["metadata"]["smelt"]["release"]["independent-crates"]
          )
          packages = {package["name"]: package for package in metadata["packages"]}
          errors = [f"unknown independent crate {name}" for name in sorted(public - packages.keys())]
          for name, package in packages.items():
              publish = package["publish"]
              if name in public and publish is not None:
                  errors.append(f"{name} must remain publishable on crates.io")
              if name not in public and publish != []:
                  errors.append(f"{name} must set publish = false")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

      - name: Build transcript benchmark target
        run: cargo test -p smelt-tui --features "harness transcript-bench" --no-run

      - name: Run tests with coverage floor
        run: cargo llvm-cov nextest --workspace --features smelt-tui/harness --fail-under-lines 80

      - name: Check Lua API docs are in sync
        run: |
          cargo xtask gen-lua-docs
          git diff --exit-code -- \
            docs/docs/reference/api \
            docs/docs/reference/configuration.md \
            docs/docs/guide/plugins.md \
            runtime/lua/smelt/_meta \
            runtime/skills/customize/SKILL.md \
            docs/zensical.toml \
            || (echo "::error::Generated Lua documentation is out of date. Run 'cargo xtask gen-lua-docs' and commit." && exit 1)

  latest-stable:
    name: Latest stable compatibility
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up latest stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: latest-stable

      - name: Check all targets
        run: cargo +stable check --workspace --all-targets --features smelt-tui/harness

  library-msrv:
    name: MSRV (${{ matrix.crate }})
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - crate: smelt-perf
            rust: "1.70"
            targets: --all-targets
            local_deps: ""
          - crate: smelt-style
            rust: "1.70"
            targets: --all-targets
            local_deps: ""
          - crate: smelt-ansi
            rust: "1.70"
            targets: --all-targets
            local_deps: smelt-style
          - crate: smelt-term
            rust: "1.71"
            targets: --lib
            local_deps: smelt-style smelt-ansi
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.crate }}-${{ matrix.rust }}

      - name: Package crate
        env:
          CRATE: ${{ matrix.crate }}
          LOCAL_DEPS: ${{ matrix.local_deps }}
        run: |
          packages=(-p "$CRATE")
          for dep in $LOCAL_DEPS; do
            packages+=(-p "$dep")
          done
          cargo package "${packages[@]}" --no-verify --target-dir /tmp/msrv-artifacts

          for dep in $LOCAL_DEPS; do
            archive="$(find /tmp/msrv-artifacts/package -maxdepth 1 -type f -name "$dep-*.crate" -print -quit)"
            test -n "$archive"
            mkdir -p "/tmp/msrv-deps/$dep"
            tar -xzf "$archive" -C "/tmp/msrv-deps/$dep" --strip-components=1
          done

          archive="$(find /tmp/msrv-artifacts/package -maxdepth 1 -type f -name "$CRATE-*.crate" -print -quit)"
          test -n "$archive"
          mkdir /tmp/msrv-package
          tar -xzf "$archive" -C /tmp/msrv-package --strip-components=1
          rm -f /tmp/msrv-package/Cargo.lock

          if test -n "$LOCAL_DEPS"; then
            printf '\n[patch.crates-io]\n' >> /tmp/msrv-package/Cargo.toml
            for dep in $LOCAL_DEPS; do
              printf '%s = { path = "/tmp/msrv-deps/%s" }\n' "$dep" "$dep" >> /tmp/msrv-package/Cargo.toml
            done
          fi

      - name: Install MSRV
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal

      - name: Check packaged crate
        run: cargo +${{ matrix.rust }} check --manifest-path /tmp/msrv-package/Cargo.toml ${{ matrix.targets }}

  windows-install:
    name: Windows install smoke test
    if: github.event_name != 'pull_request_target'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile Windows test targets
        run: cargo test --workspace --all-targets --features smelt-tui/harness --no-run

      - name: Build and run release archive
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "smelt-x86_64-pc-windows-msvc.tar.gz"
          $extractRoot = Join-Path $env:RUNNER_TEMP "smelt release"
          cargo build --profile dist --bin smelt --target x86_64-pc-windows-msvc
          tar czf $artifact -C "target/x86_64-pc-windows-msvc/dist" smelt.exe
          New-Item -ItemType Directory -Force $extractRoot | Out-Null
          tar xzf $artifact -C $extractRoot
          & (Join-Path $extractRoot "smelt.exe") --version

      - name: Install from source
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "smelt install"
          $binDir = Join-Path $installRoot "bin"
          $env:PATH = "$binDir;$env:PATH"
          cargo install --path . --locked --debug --root $installRoot
          & (Join-Path $binDir "smelt.exe") --version

  fuzz-tooling-integration:
    name: Fuzz tooling integration
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Rust
        run: rustup toolchain install

      - name: Set up Rust (nightly for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-tooling-integration

      - name: Install fuzz tooling
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked
          rustup component add llvm-tools-preview --toolchain nightly

      - name: Check isolated fixture formatting
        run: cargo fmt --manifest-path crates/xtask/tests/fixtures/fuzz-triage/Cargo.toml -- --check

      - name: Exercise real libFuzzer subprocesses
        run: |
          cargo test --locked -p xtask fuzz::real_cli_tests:: -- \
            --ignored --nocapture --test-threads=1

  fuzz-regression:
    name: Fuzz regression replay
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned Rust
        run: rustup toolchain install

      - name: Set up Rust (nightly for cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Build fuzz targets and replay regressions
        run: cargo xtask fuzz verify
