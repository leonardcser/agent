[package]
name = "smelt-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace]
exclude = ["vendor/libfuzzer-sys"]

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[features]
scenario-tools = []

[dependencies]
libfuzzer-sys = { version = "0.4.13", path = "vendor/libfuzzer-sys" }
arbitrary = { version = "1", features = ["derive"] }
smelt-tui = { path = "../crates/tui", features = ["harness"] }
smelt-edit = { path = "../crates/edit" }
smelt-core = { path = "../crates/core" }
smelt-buffer = { path = "../crates/buffer" }
smelt-style = { path = "../crates/style" }
smelt-ansi = { path = "../crates/ansi" }
smelt-term = { path = "../crates/term" }
smelt-protocol = { path = "../crates/protocol" }
smelt-engine = { path = "../crates/engine", features = ["fuzz"] }
smelt-provider = { path = "../crates/provider", features = ["fuzz"] }
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt"] }
smelt-store = { path = "../crates/store", features = ["test-util"] }
tempfile = "3.27.0"

[[bin]]
name = "smelt_loop"
path = "fuzz_targets/smelt_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_ops"
path = "fuzz_targets/text_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lua_loop"
path = "fuzz_targets/lua_loop.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attached_ops"
path = "fuzz_targets/attached_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_invariance"
path = "fuzz_targets/cache_invariance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openai_cache_invariance"
path = "fuzz_targets/openai_cache_invariance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_roundtrip"
path = "fuzz_targets/snapshot_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grid_invariants"
path = "fuzz_targets/grid_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ansi_parser"
path = "fuzz_targets/ansi_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_ops"
path = "fuzz_targets/edit_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_body"
path = "fuzz_targets/provider_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript_render"
path = "fuzz_targets/transcript_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript_scroll_ops"
path = "fuzz_targets/transcript_scroll_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_stream"
path = "fuzz_targets/provider_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "permissions_rules"
path = "fuzz_targets/permissions_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_state"
path = "fuzz_targets/store_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_events"
path = "fuzz_targets/engine_events.rs"
test = false
