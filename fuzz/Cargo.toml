bench = false

[[bin]]
name = "crash_to_scenario"
path = "src/bin/crash_to_scenario.rs"
required-features = ["scenario-tools"]
test = false
doc = false
bench = false

[[bin]]
name = "replay_scenario"
path = "src/bin/replay_scenario.rs"
required-features = ["scenario-tools"]
test = false
doc = false
bench = false

[[bin]]
name = "play_scenario"
path = "src/bin/play_scenario.rs"
required-features = ["scenario-tools"]
test = false
doc = false
bench = false

[[bin]]
name = "shrink_scenario"
path = "src/bin/shrink_scenario.rs"
required-features = ["scenario-tools"]
test = false
doc = false
bench = false

[profile.release]
debug = 1
lto = false
codegen-units = 1

[profile.release.build-override]
opt-level = 0
