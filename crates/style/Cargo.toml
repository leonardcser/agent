[package]
name = "smelt-style"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "Frontend-neutral style primitives: Color, Style, Theme, HlGroup. Shared leaf consumed by document models and renderers."
license = "MIT"
repository = "https://github.com/leonardcser/smelt"
readme = "README.md"
keywords = ["terminal", "tui", "color", "style", "theme"]
categories = ["command-line-interface"]

[lib]
name = "smelt_style"
path = "src/lib.rs"

[dependencies]
unicode-segmentation = "=1.12.0"
unicode-width = { workspace = true }
