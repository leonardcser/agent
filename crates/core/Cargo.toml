[package]
name = "smelt-core"
version = "0.5.0-alpha.12"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
smelt-protocol = { workspace = true }
smelt-engine = { workspace = true }
smelt-provider = { workspace = true }
smelt-perf = { workspace = true }
smelt-buffer = { workspace = true }
smelt-ansi = { workspace = true }
smelt-lua-doc-derive = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "io-util", "process", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-child-process"] }
sha2 = { workspace = true }
libc = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
syntect = "5"
two-face = "0.5"
similar = { version = "3", features = ["inline"] }
seahash = "4"
mlua = { workspace = true }
scraper = "0.27"
ego-tree = "0.11"
include_dir = "0.7"
neo_frizbee = { version = "0.11", features = ["safe_read"] }
notify = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
shellexpand = "3.1.2"
smelt-store = { workspace = true }
chrono = "0.4.45"
brush-parser = "0.4.0"
scoped-tls-hkt = "0.1.5"
process-wrap = { version = "9.1.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
atomic-write-file = "0.3.1"
tempfile.workspace = true

[dev-dependencies]
smelt-store = { workspace = true, features = ["test-util"] }
smelt-test-support = { workspace = true }
