[workspace]
members = ["crates/protocol", "crates/provider", "crates/engine", "crates/style", "crates/ansi", "crates/perf", "crates/buffer", "crates/term", "crates/edit", "crates/core", "crates/tui", "crates/lua-doc-derive", "crates/xtask", "crates/store", "crates/test-support"]
exclude = ["fuzz"]

[workspace.package]
rust-version = "1.95"

[workspace.metadata.smelt.release]
independent-crates = ["smelt-perf", "smelt-style", "smelt-ansi", "smelt-term"]

[workspace.dependencies]
# Internal crates
smelt-protocol = { path = "crates/protocol" }
smelt-provider = { path = "crates/provider" }
smelt-engine = { path = "crates/engine" }
smelt-style = { path = "crates/style", version = "0.4.0" }
smelt-ansi = { path = "crates/ansi", version = "0.3.0" }
smelt-perf = { path = "crates/perf", version = "0.2.0" }
smelt-buffer = { path = "crates/buffer" }
smelt-term = { path = "crates/term", version = "0.5.0" }
smelt-edit = { path = "crates/edit" }
smelt-core = { path = "crates/core" }
smelt-store = { path = "crates/store" }
smelt-tui = { path = "crates/tui", default-features = false }
smelt-lua-doc-derive = { path = "crates/lua-doc-derive" }
smelt-test-support = { path = "crates/test-support" }

# Async / runtime
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Terminal
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "bracketed-paste", "windows"] }
unicode-width = "0.2"

# Cryptography / encoding
base64 = "0.22"
sha2 = "0.11"

# Lua
mlua = { version = "0.12", features = ["lua54", "vendored"] }

# Globbing
glob = "0.3"
globset = "0.4"
ignore = "0.4"

# Filesystem watch
notify = "8.2.0"

# System
libc = "0.2"
dirs = "6"
url = "2"

# Dev
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"

[package]
name = "smelt-agent"
version = "0.5.0-alpha.12"
edition = "2021"
rust-version.workspace = true
publish = false
description = "A Rust TUI coding agent"
license = "MIT"
repository = "https://github.com/leonardcser/smelt"

[[bin]]
name = "smelt"
path = "src/main.rs"

[dependencies]
smelt-protocol = { workspace = true }
smelt-provider = { workspace = true }
smelt-engine = { workspace = true }
smelt-core = { workspace = true }
smelt-perf = { workspace = true }
smelt-tui = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
crossterm = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
smelt-store = { workspace = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Faster optimized local builds for smoke-testing performance without paying
# release LTO cost. Not used for published artifacts.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# Maximum-optimization profile for packaged release artifacts. This costs more
# compile time than `release`, but produces a smaller binary and gives LLVM the
# most room to optimize cross-crate hot paths.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release-optimized build with symbols preserved, for CPU sampling profilers
# like `samply`. Build with `cargo build --profile bench-cpu`, then run
# `samply record ./target/bench-cpu/smelt`.
[profile.bench-cpu]
inherits = "release"
strip = false
debug = true

# Faster dev/test builds: dependencies don't need debug info (we never
# step into them), and line-tables-only on our own code keeps backtraces
# usable while drastically cutting link time and dSYM generation on macOS.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test]
inherits = "dev"

[profile.test.package."*"]
debug = false

[dev-dependencies]
insta = { workspace = true }
smelt-test-support = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"
smelt-store = { path = "crates/store", features = ["test-util"] }
